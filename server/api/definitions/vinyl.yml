definitions:
  VinylRecord:
    type: object
    required:
      - id
      - title
      - artist
      - discogsId
    properties:
      id:
        type: integer
      title:
        type: string
      artist:
        type: string
      discogsId:
        type: integer
      createdAt:
        type: string
        format: date-time
      year:
        type: integer
      coverImage:
        type: string
      thumbImage:
        type: string
      genres:
        type: array
        items:
          type: string
      styles:
        type: array
        items:
          type: string

  PlayPayload:
    type: object
    required:
      - title
      - artist
    properties:
      title:
        type: string
      artist:
        type: string

  VinylPayload:
    type: object
    required:
      - discogsId
    properties:
      discogsId:
        type: integer

  MistreatedRecord:
    type: object
    properties:
      title:
        type: string
      artist:
        type: string
      sideLabel:
        type: string
      neglectScore:
        type: number
        format: float
      lastPlayed:
        type: string
        format: date-time

  VinylSearchResult:
    type: object
    required:
      - discogsId
      - title
      - artist
    properties:
      discogsId:
        type: integer
      title:
        type: string
      artist:
        type: string
      year:
        type: integer
      coverImage:
        type: string
      thumbImage:
        type: string
      genres:
        type: array
        items:
          type: string
      styles:
        type: array
        items:
          type: string

  TrackPlay:
    type: object
    properties:
      id:
        type: integer
      title:
        type: string
      artist:
        type: string
      playedAt:
        type: string
        format: date-time

  RecentPlaysResponse:
    type: object
    properties:
      plays:
        type: array
        items:
          $ref: "#/definitions/TrackPlay"

  PlayResult:
    type: object
    required:
      - playId
      - title
      - artist
      - recordTitle
      - sideLabel
      - position
      - playedAt
      - debounced
    properties:
      playId:
        type: integer
      title:
        type: string
      artist:
        type: string
      recordTitle:
        type: string
      sideLabel:
        type: string
      position:
        type: string
      coverImage:
        type: string
      playedAt:
        type: string
        format: date-time
      debounced:
        type: boolean
        description: True if the track was already played within the debounce window, so no new play was recorded and playId refers to the earlier play

  RecognizeAndPlayResult:
    type: object
    required:
      - recognized
      - matched
    properties:
      recognized:
        type: boolean
        description: Whether the audio was identified at all
      matched:
        type: boolean
        description: Whether the identified track is in the collection (and a play was registered)
      recognizedArtist:
        type: string
      recognizedTitle:
        type: string
      shazamUrl:
        type: string
      coverArt:
        type: string
      play:
        $ref: "#/definitions/PlayResult"
